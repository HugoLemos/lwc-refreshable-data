<template>
    <lightning-card title="Contacts to call" icon-name="standard:contact">
        <div class="slds-p-horizontal_medium">
            <p lwc:if={error} class="slds-text-color_error">{error}</p>
            <ul lwc:if={contacts}>
                <template for:each={contacts} for:item="contact">
                    <li key={contact.id} class="slds-grid slds-grid_vertical-align-center slds-p-vertical_x-small">
                        <div class="slds-col">
                            <p>{contact.name}</p>
                            <p class="slds-text-color_weak">{contact.title}</p>
                        </div>
                        <lightning-button label="Do not call" data-id={contact.id} onclick={handleDoNotCall}></lightning-button>
                    </li>
                </template>
            </ul>
            <p lwc:if={isEmpty} class="slds-text-color_weak">No contacts to call.</p>
        </div>
    </lightning-card>
</template>
