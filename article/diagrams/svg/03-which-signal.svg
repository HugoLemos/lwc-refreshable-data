<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500"><defs></defs><rect width="880" height="500" fill="#fff"/><text x="24" y="34" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5B6474" text-anchor="start" letter-spacing="1.3">AFTER…</text><text x="440" y="34" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5B6474" text-anchor="start" letter-spacing="1.3">SEND</text><line x1="16" y1="52" x2="864" y2="52" stroke="#C9D0DA" stroke-width="1"/><text x="24" y="81" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1A1F29" text-anchor="start">An LDS write</text><text x="24" y="104" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#5B6474" text-anchor="start"><tspan font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="13.34">updateRecord</tspan>, a record form</text><text x="440" y="81" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1F29" text-anchor="start">Nothing: record wires update themselves.</text><text x="440" y="104" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6474" text-anchor="start">Lists still need <tspan font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="14.72">refresh()</tspan>.</text><line x1="16" y1="118" x2="864" y2="118" stroke="#C9D0DA" stroke-width="1"/><text x="24" y="158" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1A1F29" text-anchor="start">An Apex write</text><rect x="440" y="136" width="170.25" height="30" rx="15" fill="#E2F2EF" stroke="#0F766E" stroke-width="1.3"/><text x="525.125" y="156.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0F766E" text-anchor="middle">LDS record notice</text><text x="622.25" y="157" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6474" text-anchor="start">then <tspan font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="14.72">refresh()</tspan></text><line x1="16" y1="184" x2="864" y2="184" stroke="#C9D0DA" stroke-width="1"/><text x="24" y="224" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1A1F29" text-anchor="start">A change cards beside it show</text><rect x="440" y="202" width="129.69119999999998" height="30" rx="15" fill="#E7EEFB" stroke="#2457C5" stroke-width="1.3"/><text x="504.8456" y="222.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2457C5" text-anchor="middle"><tspan font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="13.8">RefreshEvent</tspan></text><line x1="16" y1="250" x2="864" y2="250" stroke="#C9D0DA" stroke-width="1"/><text x="24" y="290" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1A1F29" text-anchor="start">A change cards in other tabs show</text><rect x="440" y="268" width="162.9216" height="30" rx="15" fill="#FBEEDC" stroke="#9A5300" stroke-width="1.3"/><text x="521.4608000000001" y="288.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#9A5300" text-anchor="middle"><tspan font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="13.8">RecordRefresh__c</tspan></text><line x1="16" y1="316" x2="864" y2="316" stroke="#C9D0DA" stroke-width="1"/><text x="24" y="356" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1A1F29" text-anchor="start">A change made on the server</text><rect x="440" y="334" width="162.9216" height="30" rx="15" fill="#EFE8F8" stroke="#6B3FB0" stroke-width="1.3"/><text x="521.4608000000001" y="354.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B3FB0" text-anchor="middle"><tspan font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="13.8">RecordRefresh__e</tspan></text><line x1="16" y1="382" x2="864" y2="382" stroke="#C9D0DA" stroke-width="1"/><text x="24" y="422" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1A1F29" text-anchor="start">…that a standard component shows</text><rect x="440" y="400" width="120.75000000000001" height="30" rx="15" fill="#FBE7EE" stroke="#B83256" stroke-width="1.3"/><text x="500.375" y="420.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#B83256" text-anchor="middle">Aura bridge</text><text x="572.75" y="421" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6474" text-anchor="start">f‌ires <tspan font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="14.72">force:refreshView</tspan></text><line x1="16" y1="448" x2="864" y2="448" stroke="#C9D0DA" stroke-width="1"/><text x="20" y="482" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#5B6474" text-anchor="start"><tspan font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="14.26">refreshView()</tspan> sends the record notice, the <tspan font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="14.26">RefreshEvent</tspan> and the message.</text></svg>
