<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340"><defs><marker id="head1A1F29" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1F29"/></marker><marker id="headB4342A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4342A"/></marker></defs><rect width="880" height="340" fill="#fff"/><rect x="20" y="112" width="204" height="84" rx="10" fill="#FFFFFF" stroke="#C9D0DA" stroke-width="1.5"/><text x="36" y="149.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1A1F29" text-anchor="start">Card A saves</text><text x="36" y="170.38" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B6474" text-anchor="start">calls <tspan font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="13.8">refreshView()</tspan> once</text><rect x="262" y="120" width="236" height="68" rx="34" fill="#FFFFFF" stroke="#1A1F29" stroke-width="1.6"/><text x="380" y="149.89" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1F29" text-anchor="middle"><tspan font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="14.72">RefreshEvent</tspan> · message</text><text x="380" y="168.61" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1A1F29" text-anchor="middle">sent once, by the saving card</text><rect x="540" y="26" width="240" height="66" rx="10" fill="#FFFFFF" stroke="#C9D0DA" stroke-width="1.5"/><text x="556" y="54.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1A1F29" text-anchor="start">Card B re-reads</text><text x="556" y="75.38" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B6474" text-anchor="start">sends nothing on</text><rect x="540" y="121" width="240" height="66" rx="10" fill="#FFFFFF" stroke="#C9D0DA" stroke-width="1.5"/><text x="556" y="149.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1A1F29" text-anchor="start">Card C re-reads</text><text x="556" y="170.38" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B6474" text-anchor="start">sends nothing on</text><rect x="540" y="216" width="240" height="66" rx="10" fill="#FFFFFF" stroke="#C9D0DA" stroke-width="1.5"/><text x="556" y="244.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1A1F29" text-anchor="start">Page bridge re-reads</text><text x="556" y="265.38" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B6474" text-anchor="start"><tspan font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="13.8">force:refreshView</tspan></text><path d="M224,154 C241,154 241,154 258,154" fill="none" stroke="#1A1F29" stroke-width="2" marker-end="url(#head1A1F29)"/><path d="M498,146 C517,146 517,59 536,59" fill="none" stroke="#1A1F29" stroke-width="2" marker-end="url(#head1A1F29)"/><path d="M498,154 C517,154 517,154 536,154" fill="none" stroke="#1A1F29" stroke-width="2" marker-end="url(#head1A1F29)"/><path d="M498,162 C517,162 517,249 536,249" fill="none" stroke="#1A1F29" stroke-width="2" marker-end="url(#head1A1F29)"/><path d="M780,59 C824,59 824,154 784,154" fill="none" stroke="#B4342A" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#headB4342A)"/><text x="832" y="112" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B4342A" text-anchor="start">never</text><text x="20" y="320" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#5B6474" text-anchor="start">A re-read changes no data, so it has nothing to announce.</text></svg>
